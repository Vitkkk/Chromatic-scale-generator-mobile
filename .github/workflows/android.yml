name: Build Android APK

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download original PC package from GameBanana
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-pc
          python3 - <<'PY'
          import json, pathlib, urllib.parse, urllib.request
          params = urllib.parse.urlencode({
              "itemtype": "Tool",
              "itemid": "8906",
              "fields": "Files().aFiles()",
              "return_keys": "1",
          })
          api = "https://api.gamebanana.com/Core/Item/Data?" + params
          with urllib.request.urlopen(api, timeout=60) as response:
              data = json.load(response)
          pathlib.Path("original-pc/gamebanana-files.json").write_text(
              json.dumps(data, indent=2), encoding="utf-8")

          values = data.get("Files().aFiles()", data)
          if isinstance(values, list) and len(values) == 1 and isinstance(values[0], dict):
              values = values[0]
          if not isinstance(values, dict):
              raise RuntimeError(f"Unexpected files response: {values!r}")

          for file_id, meta in values.items():
              name = meta.get("_sFile") if isinstance(meta, dict) else None
              name = pathlib.Path(name or f"gamebanana-{file_id}.bin").name
              url = f"https://gamebanana.com/dl/{file_id}"
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=240) as response:
                  pathlib.Path("original-pc", name).write_bytes(response.read())
              print(file_id, name)
          PY

      - name: Extract source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-pc/extracted
          for f in original-pc/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.zip) unzip -o "$f" -d original-pc/extracted ;;
              *.7z|*.rar) 7z x -y "$f" -ooriginal-pc/extracted ;;
            esac
          done
          find original-pc/extracted -type f -maxdepth 8 -print | sort > original-pc/file-list.txt
          grep -RniE "parselmouth|To Manipulation|Extract pitch tier|Replace pitch tier|resynthesis|Resample|duration" \
            original-pc/extracted > original-pc/source-matches.txt || true

      - name: Upload desktop source audit
        uses: actions/upload-artifact@v4
        with:
          name: original-pc-source-audit
          path: original-pc
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test Java audio utilities
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK with desktop Praat engine
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace --info 2>&1 | tee native-build.log

      - name: Upload native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: native-build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-scale-generator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
